server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # El enrutado lo resuelve React Router en el cliente.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
